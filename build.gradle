buildscript {
    dependencies {
        // AGP 9 компилирует Kotlin сам (built-in Kotlin) и берёт KGP с buildscript classpath.
        // Свою версию KGP AGP тянет транзитивно, поэтому версию проекта пиним здесь явно —
        // иначе Kotlin молча откатится на ту, что зашита в AGP.
        classpath libs.kotlin.gradle.plugin
    }
}

plugins {
    alias(libs.plugins.ksp) apply false
    alias(libs.plugins.koinCompiler) apply false
    alias(libs.plugins.kotlinJvm)
}
