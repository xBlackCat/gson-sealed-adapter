# ─────────────────────────────────────────────────────────────────────────────
# GSON Kotlin Sealed Class Adapter — Gradle Version Catalog
#
# Single source of truth for plugin & library versions.
#   • Shared versions (used by 2+ artifacts) live in [versions] and are
#     referenced from [libraries] via `version.ref`.
#   • One-off versions are inlined directly on the [libraries] entry.
#   • Libraries sharing a version.ref are grouped in [bundles] and consumed
#     from build scripts via `libs.bundles.<name>`.
#
# Access from Groovy build scripts:
#   • library  → libs.<alias>            (e.g. libs.kotlin.stdlib)
#   • version  → libs.versions.<name>    (e.g. libs.versions.kotlin.get())
#   • bundle   → libs.bundles.<name>     (e.g. libs.bundles.kotlin)
#   • plugin   → libs.plugins.<alias>    (e.g. alias(libs.plugins.kotlinJvm))
# ─────────────────────────────────────────────────────────────────────────────

[versions]
# ── Toolchain ───────────────────────────────────────────────────────────────
jvmToolchain   = "21"
kotlin         = "2.4.21"
ksp            = "2.3.9"

[libraries]
# ── Kotlin ─────────────────────────────────────────────────────────────────
kotlin-stdlib            = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlin-stdlib-jdk8       = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-reflect           = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
# Кладётся на buildscript classpath корневого проекта (см. build.gradle),
# чтобы зафиксировать версию Kotlin Gradle Plugin явно.
kotlin-gradle-plugin     = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

# ── GSON ───────────────────────────────────────────────────────────────────
gson                     = { group = "com.google.code.gson", name = "gson", version = "2.14.0" }

# ── Testing ────────────────────────────────────────────────────────────────
junit-bom                = { group = "org.junit", name = "junit-bom", version = "6.1.3" }
junit-jupiter            = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher  = { group = "org.junit.platform", name = "junit-platform-launcher" }

[bundles]
kotlin = ["kotlin-stdlib", "kotlin-stdlib-jdk8", "kotlin-reflect"]

[plugins]
kotlinJvm      = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp            = { id = "com.google.devtools.ksp", version.ref = "ksp" }
mavenPublish   = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
